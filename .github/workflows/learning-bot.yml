name: Learning bot tests
on:
  push:
    paths:
      - "learning-bot/**"
      - ".github/workflows/learning-bot.yml"
  pull_request:
    paths:
      - "learning-bot/**"
      - ".github/workflows/learning-bot.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          node --check learning-bot/src/store.mjs
          node --check learning-bot/src/pi.mjs
          node --check learning-bot/src/telegram.mjs
          node --check learning-bot/bin/learn.mjs
      - name: Unit tests
        working-directory: learning-bot
        run: npm test
